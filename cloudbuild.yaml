# Cloud Build Configuration for ReserveSightseen
# ================================================================
# 使い方:
# gcloud builds submit --config=cloudbuild.yaml --substitutions=_REGION=asia-northeast1,_PROJECT_ID=YOUR_PROJECT_ID

steps:
  # ================================================================
  # Backend Build & Deploy
  # ================================================================
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-backend'
    args: [
      'build',
      '-t', '${_REGION}-docker.pkg.dev/${_PROJECT_ID}/reserve-sightseen/backend:${SHORT_SHA}',
      '-t', '${_REGION}-docker.pkg.dev/${_PROJECT_ID}/reserve-sightseen/backend:latest',
      './backend'
    ]
    dir: '.'

  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-backend'
    args: ['push', '${_REGION}-docker.pkg.dev/${_PROJECT_ID}/reserve-sightseen/backend:${SHORT_SHA}']
    waitFor: ['build-backend']

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-backend'
    entrypoint: 'gcloud'
    args: [
      'run', 'deploy', 'reserve-backend',
      '--image', '${_REGION}-docker.pkg.dev/${_PROJECT_ID}/reserve-sightseen/backend:${SHORT_SHA}',
      '--region', '${_REGION}',
      '--platform', 'managed',
      '--allow-unauthenticated',
      '--port', '8000',
      '--memory', '512Mi',
      '--cpu', '1',
      '--min-instances', '0',
      '--max-instances', '10',
      '--set-env-vars', 'RAKUTEN_APPLICATION_ID=$$RAKUTEN_APPLICATION_ID,RAKUTEN_AFFILIATE_ID=$$RAKUTEN_AFFILIATE_ID,RAKUTEN_ACCESS_KEY=$$RAKUTEN_ACCESS_KEY,GOOGLE_PLACES_API_KEY=$$GOOGLE_PLACES_API_KEY,ANTHROPIC_API_KEY=$$ANTHROPIC_API_KEY,CORS_ORIGINS=https://${_FRONTEND_URL}',
    ]
    waitFor: ['push-backend']
    secretEnv: ['RAKUTEN_APPLICATION_ID', 'RAKUTEN_AFFILIATE_ID', 'RAKUTEN_ACCESS_KEY', 'GOOGLE_PLACES_API_KEY', 'ANTHROPIC_API_KEY']

  # ================================================================
  # Frontend Build & Deploy
  # ================================================================
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-frontend'
    args: [
      'build',
      '-t', '${_REGION}-docker.pkg.dev/${_PROJECT_ID}/reserve-sightseen/frontend:${SHORT_SHA}',
      '-t', '${_REGION}-docker.pkg.dev/${_PROJECT_ID}/reserve-sightseen/frontend:latest',
      './frontend'
    ]
    dir: '.'

  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-frontend'
    args: ['push', '${_REGION}-docker.pkg.dev/${_PROJECT_ID}/reserve-sightseen/frontend:${SHORT_SHA}']
    waitFor: ['build-frontend']

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-frontend'
    entrypoint: 'gcloud'
    args: [
      'run', 'deploy', 'reserve-frontend',
      '--image', '${_REGION}-docker.pkg.dev/${_PROJECT_ID}/reserve-sightseen/frontend:${SHORT_SHA}',
      '--region', '${_REGION}',
      '--platform', 'managed',
      '--allow-unauthenticated',
      '--port', '3000',
      '--memory', '512Mi',
      '--cpu', '1',
      '--min-instances', '0',
      '--max-instances', '10',
      '--set-env-vars', 'NEXT_PUBLIC_API_BASE=https://reserve-backend-${_REGION}-${_PROJECT_ID}.a.run.app',
    ]
    waitFor: ['push-frontend']

# ================================================================
# Artifact Registry リポジトリ事前作成必要
# gcloud artifacts repositories create reserve-sightseen \
#   --location=asia-northeast1 --repository-format=docker
# ================================================================

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'

substitutions:
  _REGION: 'asia-northeast1'
  _PROJECT_ID: ''
  _FRONTEND_URL: ''

availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/RAKUTEN_APPLICATION_ID/versions/latest
      env: RAKUTEN_APPLICATION_ID
    - versionName: projects/$PROJECT_ID/secrets/RAKUTEN_AFFILIATE_ID/versions/latest
      env: RAKUTEN_AFFILIATE_ID
    - versionName: projects/$PROJECT_ID/secrets/RAKUTEN_ACCESS_KEY/versions/latest
      env: RAKUTEN_ACCESS_KEY
    - versionName: projects/$PROJECT_ID/secrets/GOOGLE_PLACES_API_KEY/versions/latest
      env: GOOGLE_PLACES_API_KEY
    - versionName: projects/$PROJECT_ID/secrets/ANTHROPIC_API_KEY/versions/latest
      env: ANTHROPIC_API_KEY